{
  "name": "Dockerfs preflight (fork only)",
  "on": {
    "push": {
      "branches": [
        "codex/dockerfs-preflight"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "check": {
      "name": "${{ matrix.patch }} / Go ${{ matrix.go }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "patch": "cleanup",
              "sha": "1266c9bf1575867e01e064c33998e2cef615265b",
              "go": "1.26"
            },
            {
              "patch": "cleanup",
              "sha": "1266c9bf1575867e01e064c33998e2cef615265b",
              "go": "1.27"
            },
            {
              "patch": "reader",
              "sha": "b6a73c45e6f4a15333abd52777f1f7820a914789",
              "go": "1.26"
            },
            {
              "patch": "reader",
              "sha": "b6a73c45e6f4a15333abd52777f1f7820a914789",
              "go": "1.27"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "ref": "${{ matrix.sha }}"
          }
        },
        {
          "name": "Verify tested source",
          "env": {
            "EXPECTED_SHA": "${{ matrix.sha }}"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ngit show -s --format=\"%H %s\" HEAD"
        },
        {
          "uses": "actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff",
          "with": {
            "go-version": "${{ matrix.go }}",
            "cache": false
          }
        },
        {
          "name": "Runtime",
          "run": "go version\nuname -a"
        },
        {
          "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "~/go/pkg/mod\n~/.cache/go-build",
            "key": "dockerfs-${{ runner.os }}-${{ matrix.go }}-${{ matrix.patch }}-${{ github.run_id }}",
            "restore-keys": "dockerfs-${{ runner.os }}-${{ matrix.go }}-"
          }
        },
        {
          "name": "Build",
          "run": "go run ./ci -v build"
        },
        {
          "name": "Tests",
          "run": "go run ./ci -v test"
        },
        {
          "name": "Lint",
          "run": "go run ./ci -v lint"
        },
        {
          "name": "Formatting",
          "run": "go run ./ci -v fmt-check"
        },
        {
          "name": "Imports",
          "run": "go run ./ci -v imports-check"
        },
        {
          "name": "License headers",
          "run": "go run ./ci -v license-check"
        },
        {
          "name": "Focused race checks",
          "run": "go test -race ./internal/proxy/dockerfs ./pkg/proxy/docker"
        }
      ]
    }
  }
}
